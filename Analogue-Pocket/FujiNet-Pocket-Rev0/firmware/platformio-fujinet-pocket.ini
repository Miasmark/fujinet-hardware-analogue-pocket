; FujiNet Pocket Rev0 (DRAFT): proposed as build-platforms/platformio-fujinet-pocket.ini,
; modelled on platformio-fujiversal-rs232.ini.  The RS232 build on a wired UART (pocket.h
; defines PIN_UART1_RX), so no USB host flags.
[fujinet]
build_bus = RS232
build_platform = BUILD_RS232

[env:fujinet-pocket]
build_type = debug
build_flags =
    ${env.build_flags}
    -D PINMAP_FUJINET_POCKET
platform = espressif32@${fujinet.esp32s3_platform_version}
platform_packages = ${fujinet.esp32s3_platform_packages}
board = esp32-s3-wroom-1-n16r8
